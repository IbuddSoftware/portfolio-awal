
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f5ef;
            color: #263b32;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d5dbd4;
            border-radius: 6px;
            font-family: inherit;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button, a {
            display: inline-block;
            margin-top: 22px;
            padding: 11px 17px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #355b49;
            color: white;
        }

        a {
            background: #e3e9df;
            color: #355b49;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>{{ page_title }}</h1>

    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >

        <label>Nama Organisasi / Tempat</label>
        <input
            type="text"
            name="organization"
            value="{{ experience.organization if experience else '' }}"
            placeholder="Contoh: IPNU"
            required
        >

        <label>Posisi / Jabatan</label>
        <input
            type="text"
            name="position"
            value="{{ experience.position if experience else '' }}"
            placeholder="Contoh: Ketua"
        >

        <label>Jenis Pengalaman</label>
        <select name="experience_type">
            {% set current_type = experience.experience_type if experience else 'Organisasi' %}

            <option value="Organisasi" {% if current_type == 'Organisasi' %}selected{% endif %}>
                Organisasi
            </option>

            <option value="Kepanitiaan" {% if current_type == 'Kepanitiaan' %}selected{% endif %}>
                Kepanitiaan
            </option>

            <option value="PKL" {% if current_type == 'PKL' %}selected{% endif %}>
                PKL
            </option>

            <option value="Pekerjaan" {% if current_type == 'Pekerjaan' %}selected{% endif %}>
                Pekerjaan
            </option>

            <option value="Lainnya" {% if current_type == 'Lainnya' %}selected{% endif %}>
                Lainnya
            </option>
        </select>

        <label>Periode Mulai</label>
        <input
            type="text"
            name="start_period"
            value="{{ experience.start_period if experience else '' }}"
            placeholder="Contoh: 2023"
        >

        <label>Periode Selesai</label>
        <input
            type="text"
            name="end_period"
            value="{{ experience.end_period if experience else '' }}"
            placeholder="Contoh: 2024 atau kosongkan jika masih berlangsung"
        >

        <label>Deskripsi</label>
        <textarea
            name="description"
            placeholder="Jelaskan tanggung jawab atau pengalaman yang diperoleh."
        >{{ experience.description if experience else '' }}</textarea>

        <label>Urutan Tampilan</label>
        <input
            type="number"
            name="sort_order"
            value="{{ experience.sort_order if experience else 0 }}"
        >

        <button type="submit">Simpan</button>

        <a href="{{ url_for('admin_experiences') }}">
            Batal
        </a>

    </form>

</div>

</body>
</html>
