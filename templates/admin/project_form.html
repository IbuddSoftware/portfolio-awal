
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | Admin</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 25px;
            background: #efeee7;
            color: #354139;
            font-family: Arial, sans-serif;
        }

        .form-card {
            max-width: 650px;
            margin: 30px auto;
            padding: 30px;
            background: #f8f7f2;
            border-radius: 12px;
        }

        h1 { color: #344b40; }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #deded3;
            border-radius: 7px;
            font: inherit;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .checkbox-row input {
            width: auto;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button, .back {
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        button {
            background: #344b40;
            color: white;
        }

        .back {
            background: #deded3;
            color: #354139;
        }

        .message {
            padding: 12px;
            background: #f1e5df;
            border-radius: 7px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
<div class="form-card">

    <h1>{{ page_title }}</h1>
    <p>Lengkapi informasi proyek portofolio kamu.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label for="title">Nama Proyek *</label>
        <input
            type="text"
            id="title"
            name="title"
            value="{{ project.title if project else '' }}"
            required
        >

        <label for="description">Deskripsi</label>
        <textarea
            id="description"
            name="description"
        >{{ project.description if project and project.description else '' }}</textarea>

        <label for="technologies">Teknologi yang Digunakan</label>
        <input
            type="text"
            id="technologies"
            name="technologies"
            value="{{ project.technologies if project and project.technologies else '' }}"
            placeholder="Contoh: HTML, CSS, Python, Flask"
        >

        <label for="project_url">Link Proyek</label>
        <input
            type="url"
            id="project_url"
            name="project_url"
            value="{{ project.project_url if project and project.project_url else '' }}"
            placeholder="https://..."
        >

        <label for="image_url">Alamat Gambar</label>
        <input
            type="text"
            id="image_url"
            name="image_url"
            value="{{ project.image_url if project and project.image_url else '' }}"
            placeholder="/static/images/nama-gambar.jpg"
        >

        <label for="sort_order">Urutan Tampilan</label>
        <input
            type="number"
            id="sort_order"
            name="sort_order"
            value="{{ project.sort_order if project else 0 }}"
        >

        <div class="checkbox-row">
            <input
                type="checkbox"
                id="is_featured"
                name="is_featured"
                {% if project and project.is_featured %}checked{% endif %}
            >
            <label for="is_featured" style="margin: 0;">
                Jadikan proyek unggulan
            </label>
        </div>

        <div class="buttons">
            <button type="submit">Simpan Proyek</button>
            <a href="{{ url_for('admin_projects') }}" class="back">
                Batal
            </a>
        </div>
    </form>

</div>
</body>
</html>
